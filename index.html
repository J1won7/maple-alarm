<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메이플 스킬 타이머</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #131820; color: #eef3f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1060px; padding: 28px 20px; margin: auto; }
    h1 { font-size: 25px; margin: 0; } h2 { font-size: 18px; margin: 0; }
    header, .row, .card-head, .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    header { justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid #39424d; }
    button, input { font: inherit; color: inherit; }
    button { border: 1px solid #4b5964; border-radius: 5px; background: #28343d; padding: 9px 13px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; } button.primary { background: #007f6a; border-color: #18aa91; }
    input[type=number], input[type=text] { width: 100%; padding: 9px; background: #10161b; border: 1px solid #4b5964; border-radius: 4px; margin-top: 5px; }
    input[type=range] { width: 150px; accent-color: #35bba2; } label { display: block; font-size: 14px; color: #c5d0d7; }
    .toolbar { padding: 18px 0; border-bottom: 1px solid #39424d; } .toolbar label { display: flex; align-items: center; gap: 8px; }
    .toolbar input[type=number] { width: 75px; margin: 0; }
    #status, .hint { font-size: 13px; color: #a9b9c4; line-height: 1.5; }
    .list-head { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 14px; }
    .skill-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
    .skill-card { border: 1px solid #3b4851; background: #1c252b; border-radius: 6px; padding: 16px; min-width: 0; }
    .card-head { justify-content: space-between; } .card-head strong { font-size: 16px; overflow-wrap: anywhere; }
    .timer { display: block; font-size: 24px; font-variant-numeric: tabular-nums; margin: 18px 0 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 14px; }
    dialog { width: min(580px, calc(100% - 24px)); max-height: calc(100vh - 24px); overflow: auto; border: 1px solid #52616a; border-radius: 7px; background: #1b232a; color: inherit; padding: 20px; }
    dialog::backdrop { background: #000b; } .form-grid { display: grid; gap: 14px; margin: 18px 0; }
    #roiDialog { width: min(1100px, calc(100% - 24px)); }
    .roi-tools { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    #roiViewport { width: 100%; height: min(68vh, 700px); overflow: auto; background: #080b0d; }
    #roiCanvas { display: block; width: auto; height: auto; max-width: none; max-height: none; touch-action: none; cursor: crosshair; }
    .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; } .empty { padding: 30px 0; color: #a9b9c4; }
  </style>
</head>
<body>
<main>
  <header><h1>스킬 타이머</h1><div class="row"><button id="share" class="primary">화면 공유</button><button id="stop" disabled>공유 중지</button></div></header>
  <div class="toolbar">
    <label>검사 간격 <input id="interval" type="number" value="1" min="0.5" max="30" step="0.5"> 초</label>
    <label>알림 음량 <input id="volume" type="range" min="0" max="200" value="100"><span id="volumeValue">100%</span></label>
    <button id="testSound">소리 테스트</button>
    <label><input id="notifications" type="checkbox"> 브라우저 알림</label>
  </div>
  <p id="status" role="status">화면 공유를 시작해 주세요.</p>
  <div class="list-head"><h2>스킬 목록</h2><button id="add" class="primary">+ 스킬 추가</button></div>
  <div id="list" class="skill-list"></div>
</main>
<video id="video" autoplay muted playsinline hidden></video>
<dialog id="editDialog">
  <h2 id="editTitle">스킬 추가</h2>
  <form id="editForm">
    <div class="form-grid">
      <label>스킬 이름<input id="name" type="text" maxlength="40" required></label>
      <label>쿨타임 (초)<input id="cooldown" type="number" min="1" max="86400" step="1" value="120" required></label>
      <label>지속시간 (초)<input id="duration" type="number" min="0" max="86400" step="1" value="120" required></label>
      <div><button id="selectRoi" type="button">ROI 지정</button><p class="hint" id="roiSummary">영역을 지정해 주세요.</p></div>
    </div>
    <p id="editError" class="hint" role="alert"></p>
    <div class="actions"><button class="primary" type="submit">저장</button><button id="cancelEdit" type="button">취소</button></div>
  </form>
</dialog>
<dialog id="roiDialog">
  <h2>스킬 영역 지정</h2><p class="hint">공유 화면에서 스킬의 쿨타임 숫자가 표시되는 영역을 드래그하세요.</p>
  <div class="roi-tools"><label for="roiZoom">확대</label><input id="roiZoom" type="range" min="1" max="4" step="0.1" value="1"><span id="roiZoomValue">100%</span></div>
  <div id="roiViewport"><canvas id="roiCanvas"></canvas></div><p id="roiError" class="hint" role="alert"></p>
  <div class="actions"><button id="saveRoi" class="primary">영역 적용</button><button id="cancelRoi">취소</button></div>
</dialog>
<script defer src="./skill-v2.js"></script>
</body>
</html>
